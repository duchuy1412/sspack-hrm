# Cấu hình chung. Giá trị local lấy từ infra/.env (dùng chung với docker compose); thiếu thì dùng mặc định.
spring:
  application:
    name: sspack-hrm
  config:
    import: optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrm}
    username: ${DB_USERNAME:hrm}
    password: ${DB_PASSWORD:hrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hrm
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    schemas: hrm
    default-schema: hrm
    create-schemas: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

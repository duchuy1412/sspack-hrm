# Cấu hình chung. Giá trị local lấy từ infra/.env (dùng chung với docker compose); thiếu thì dùng mặc định.
spring:
  application:
    name: sspack-hrm
  config:
    import: optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrm}
    username: ${DB_USERNAME:hrm}
    password: ${DB_PASSWORD:hrm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hrm
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    schemas: hrm
    default-schema: hrm
    create-schemas: true
    locations: classpath:db/migration
    # Seed demo (repeatable, chỉ profile dev) không có ở profile khác: không coi là lỗi khi validate
    ignore-migration-patterns: "*:future,repeatable:missing"
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

# Xác thực (PLT-01). Thời lượng theo tiêu chí chấp nhận trong SRS.
hrm:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: sspack-hrm
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Hai tab cùng làm mới một lúc: token cũ dùng lại trong khoảng này chỉ bị từ chối, không bị coi là đánh cắp
    refresh-reuse-grace: 30s
    max-failed-attempts: 5
    lock-duration: 15m
    cookie:
      name: hrm_refresh
      path: /api/v1/auth
      secure: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
